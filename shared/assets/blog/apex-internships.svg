<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img">
  <defs>
    <linearGradient id="in-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fcfc"/><stop offset="1" stop-color="#e4f5f3"/>
    </linearGradient>
    <radialGradient id="in-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00B3A4" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#00B3A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="in-step" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#00C3B2"/><stop offset="1" stop-color="#00897E"/>
    </linearGradient>
    <pattern id="in-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#00B3A4" fill-opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="url(#in-bg)"/>
  <rect width="1200" height="520" fill="url(#in-dots)"/>
  <ellipse cx="600" cy="266" rx="430" ry="230" fill="url(#in-glow)"/>

  <!-- mentor + interns -->
  <g>
    <!-- mentor -->
    <circle cx="196" cy="262" r="62" fill="#00897E"/>
    <circle cx="196" cy="243" r="22" fill="#ffffff"/>
    <path d="M160 310a36 36 0 0 1 72 0z" fill="#ffffff"/>
    <!-- interns -->
    <circle cx="300" cy="196" r="46" fill="#ffffff" stroke="#bfe5e0" stroke-width="2"/>
    <circle cx="300" cy="184" r="16" fill="#00B3A4"/>
    <path d="M274 230a26 26 0 0 1 52 0z" fill="#00B3A4"/>
    <!-- graduation cap on the first intern -->
    <g fill="#0b2233">
      <path d="M300 146l32 13-32 13-32-13z"/>
      <path d="M318 166v12c0 6-8 10-18 10s-18-4-18-10v-12l18 7z"/>
    </g>

    <circle cx="300" cy="330" r="46" fill="#ffffff" stroke="#bfe5e0" stroke-width="2"/>
    <circle cx="300" cy="318" r="16" fill="#00B3A4"/>
    <path d="M274 364a26 26 0 0 1 52 0z" fill="#00B3A4"/>
  </g>

  <!-- link lines into the project board -->
  <g stroke="#00B3A4" stroke-opacity="0.5" stroke-width="2.5" fill="none" stroke-dasharray="9 9">
    <path d="M350 200h40a24 24 0 0 1 24 24v30"/>
    <path d="M350 330h40a24 24 0 0 0 24-24v-30"/>
  </g>

  <!-- project board -->
  <g>
    <rect x="426" y="132" width="364" height="260" rx="24" fill="#ffffff" stroke="#d3ece9" stroke-width="2"/>
    <rect x="426" y="132" width="364" height="52" rx="24" fill="#0b2233"/>
    <rect x="426" y="160" width="364" height="24" fill="#0b2233"/>
    <g fill="#ffffff" fill-opacity="0.72">
      <rect x="456" y="151" width="74" height="12" rx="6"/>
      <rect x="700" y="151" width="60" height="12" rx="6"/>
    </g>
    <!-- three lanes of real work -->
    <g>
      <rect x="456" y="212" width="98" height="150" rx="12" fill="#f2faf9"/>
      <rect x="560" y="212" width="98" height="150" rx="12" fill="#f2faf9"/>
      <rect x="664" y="212" width="98" height="150" rx="12" fill="#f2faf9"/>
      <g fill="#cdeae6">
        <rect x="470" y="228" width="70" height="30" rx="8"/>
        <rect x="470" y="266" width="70" height="30" rx="8"/>
        <rect x="574" y="228" width="70" height="30" rx="8"/>
        <rect x="678" y="228" width="70" height="30" rx="8"/>
        <rect x="678" y="266" width="70" height="30" rx="8"/>
        <rect x="678" y="304" width="70" height="30" rx="8"/>
      </g>
      <rect x="574" y="266" width="70" height="30" rx="8" fill="#00B3A4"/>
      <path d="M596 281l7 7 13-13" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- growth into a real role -->
  <g>
    <rect x="852" y="312" width="78" height="62" rx="12" fill="#cdeae6"/>
    <rect x="946" y="258" width="78" height="116" rx="12" fill="#8fd8d1"/>
    <rect x="1040" y="196" width="78" height="178" rx="12" fill="url(#in-step)"/>
    <g stroke="#00897E" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M864 286l98-62 96-70"/>
      <path d="M1026 150h36v36"/>
    </g>
  </g>
</svg>
