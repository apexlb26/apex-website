<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img">
  <defs>
    <linearGradient id="ar-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7fcfc"/><stop offset="1" stop-color="#e4f5f3"/>
    </linearGradient>
    <radialGradient id="ar-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00B3A4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00B3A4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ar-orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00C3B2"/><stop offset="1" stop-color="#00897E"/>
    </linearGradient>
    <pattern id="ar-dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#00B3A4" fill-opacity="0.13"/>
    </pattern>
  </defs>

  <rect width="1200" height="520" fill="url(#ar-bg)"/>
  <rect width="1200" height="520" fill="url(#ar-dots)"/>
  <ellipse cx="600" cy="266" rx="430" ry="230" fill="url(#ar-glow)"/>

  <!-- connectors -->
  <g stroke="#00B3A4" stroke-opacity="0.5" stroke-width="2.5" fill="none" stroke-dasharray="9 9">
    <path d="M332 262h182"/>
    <path d="M686 262h182"/>
  </g>
  <g fill="#00B3A4">
    <circle cx="470" cy="262" r="5.5"/><circle cx="730" cy="262" r="5.5"/>
  </g>

  <!-- incoming call card -->
  <g>
    <rect x="96" y="178" width="236" height="168" rx="22" fill="#ffffff" stroke="#d3ece9" stroke-width="2"/>
    <circle cx="166" cy="246" r="30" fill="#e4f6f4"/>
    <path d="M154 236c0-4 3-7 7-7l6 1 3 11-6 5c3 6 8 11 14 14l5-6 11 3 1 6c0 4-3 7-7 7-16-2-32-18-34-34Z" fill="#00897E"/>
    <g stroke="#00B3A4" stroke-width="3" fill="none" stroke-linecap="round" stroke-opacity="0.8">
      <path d="M208 234a22 22 0 0 1 0 26"/>
      <path d="M224 226a38 38 0 0 1 0 42"/>
    </g>
    <rect x="124" y="296" width="130" height="11" rx="5.5" fill="#cfe9e6"/>
    <rect x="124" y="316" width="86" height="11" rx="5.5" fill="#e0f2f0"/>
  </g>

  <!-- assistant orb -->
  <g>
    <circle cx="600" cy="262" r="134" fill="#00B3A4" fill-opacity="0.07"/>
    <circle cx="600" cy="262" r="110" fill="#00B3A4" fill-opacity="0.11"/>
    <circle cx="600" cy="262" r="86" fill="url(#ar-orb)"/>
    <!-- headset -->
    <g stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M560 266v-10a40 40 0 0 1 80 0v10"/>
    </g>
    <rect x="548" y="258" width="24" height="42" rx="11" fill="#ffffff"/>
    <rect x="628" y="258" width="24" height="42" rx="11" fill="#ffffff"/>
    <path d="M640 300v4a18 18 0 0 1-18 18h-10" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="604" cy="322" r="9" fill="#ffffff"/>
    <!-- spark: the assistant is the AI, not a person -->
    <path d="M600 196l7 17 17 7-17 7-7 17-7-17-17-7 17-7z" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- booking card -->
  <g>
    <rect x="868" y="150" width="252" height="224" rx="22" fill="#ffffff" stroke="#d3ece9" stroke-width="2"/>
    <rect x="868" y="150" width="252" height="48" rx="22" fill="#0b2233"/>
    <rect x="868" y="176" width="252" height="22" fill="#0b2233"/>
    <g fill="#ffffff" fill-opacity="0.75">
      <rect x="896" y="166" width="58" height="10" rx="5"/>
      <rect x="1038" y="166" width="54" height="10" rx="5"/>
    </g>
    <g fill="#e2f3f1">
      <rect x="896" y="220" width="86" height="34" rx="9"/>
      <rect x="1006" y="220" width="86" height="34" rx="9"/>
      <rect x="896" y="268" width="86" height="34" rx="9"/>
    </g>
    <rect x="1006" y="268" width="86" height="34" rx="9" fill="#00B3A4"/>
    <path d="M1036 285l8 8 16-16" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="896" y="320" width="196" height="12" rx="6" fill="#d9eeec"/>
    <rect x="896" y="342" width="124" height="12" rx="6" fill="#e8f5f3"/>
  </g>

  <!-- floating chat bubbles -->
  <g fill="#ffffff" stroke="#d3ece9" stroke-width="2">
    <rect x="430" y="92" width="118" height="46" rx="18"/>
    <rect x="664" y="372" width="140" height="46" rx="18"/>
  </g>
  <g fill="#9fd8d2">
    <circle cx="460" cy="115" r="6"/><circle cx="482" cy="115" r="6"/><circle cx="504" cy="115" r="6"/>
    <circle cx="694" cy="395" r="6"/><circle cx="716" cy="395" r="6"/><circle cx="738" cy="395" r="6"/>
  </g>
</svg>
