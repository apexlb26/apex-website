# Render Blueprint for the APEX website.
#
# Render runs a persistent Node process, which is what this app needs:
# server.mjs serves Next *and* holds the Socket.IO connection open, so a CMS
# publish reaches open browsers instantly. (On serverless hosts the socket
# cannot connect and clients fall back to polling.)
#
# To use: push this file, then in Render choose New > Blueprint and point it at
# this repository. Values marked `sync: false` are set in the dashboard, not
# here - they are secrets and must not live in git.

services:
  - type: web
    name: apex-website
    runtime: node
    # The running service is in oregon, so this records what actually exists
    # rather than what we would pick again.
    #
    # Atlas is in AWS us-east-1 (Ashburn, Virginia), so every page render makes
    # a cross-country database round trip - measured at about 40ms. Judged not
    # worth recreating a live service for, since Render fixes a service's region
    # at creation and cannot change it afterwards.
    #
    # If this service is ever rebuilt, set `virginia` to match Atlas - and check
    # the dashboard afterwards: an earlier deploy of this blueprint asked for
    # frankfurt and was placed in oregon regardless.
    region: oregon
    # `starter` keeps the process warm. The free plan spins down after ~15
    # minutes idle, which means a cold start of up to a minute for the next
    # visitor and a dropped Socket.IO connection. Fine for testing, not for a
    # site real people visit.
    plan: starter
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    # Liveness only - it touches no database. The site serves the bundled JSON
    # snapshot when MongoDB is unreachable, so a health check that queried
    # MongoDB would block on the driver timeout, fail the probe, and return
    # 502s instead of the fallback content.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"

      # ---------------------------------------------------------- database
      # MongoDB Atlas connection string. Render has no managed MongoDB, so this
      # points at Atlas (or any reachable MongoDB).
      # Format: mongodb+srv://user:password@cluster.mongodb.net/?retryWrites=true&w=majority
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: apex

      # ------------------------------------------------------------- admin
      - key: APEX_ADMIN_EMAIL
        sync: false
      - key: APEX_ADMIN_PASSWORD
        sync: false
      # Signs the admin session cookie. Render generates a strong value once
      # and keeps it; changing it logs every admin out.
      - key: APEX_ADMIN_SECRET
        generateValue: true

      # -------------------------------------------------------------- mail
      # Optional. Without a transport, submissions are still stored in MongoDB
      # and simply are not emailed.
      - key: APEX_NOTIFY_EMAIL
        sync: false
      - key: APEX_MAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

      # --------------------------------------------------------------- seo
      - key: NEXT_PUBLIC_APEX_SITE_URL
        sync: false
